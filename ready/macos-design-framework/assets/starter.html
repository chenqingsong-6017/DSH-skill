<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>macOS Design Framework · Starter</title>
<!-- 设计令牌 + 组件配方：零依赖，双击即开（file:// 相对路径可直接加载） -->
<link rel="stylesheet" href="../references/tokens.css">
<link rel="stylesheet" href="../references/components.css">
<style>
  /* 只放「骨架专属」样式：桌面/壁纸/摆位。可复用组件一律来自 components.css */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI','Helvetica Neue',sans-serif;
    font-size:var(--fs-body); color:var(--label-1);
    background:var(--window-bg); overflow:hidden;
    transition:background var(--dur-theme) var(--ease-out);
  }
  [data-theme="dark"] body{background:var(--window-bg)}

  /* 壁纸（换掉 gradient 即可；一次性装饰底，非组件令牌，故豁免自检） */
  #wall{position:fixed;inset:0;z-index:-1; background:radial-gradient(1200px 700px at 22% 18%,#8ea9d8,transparent 60%),radial-gradient(900px 600px at 82% 78%,#c7a8d8,transparent 62%),linear-gradient(160deg,#a9c3e6,#d9d3e8 55%,#e9dfe6); transition:filter var(--dur-theme) var(--ease-out)} /* audit:ignore MAC001 壁纸渐变为一次性装饰底 */
  [data-theme="dark"] #wall{filter:brightness(.42) saturate(.75)}

  /* 菜单栏（功能层玻璃） */
  .menubar{position:fixed;top:0;left:0;right:0;height:var(--h-menubar);
    display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-3);
    z-index:var(--z-menubar);font-size:var(--fs-label)}
  .menubar b{font-weight:var(--fw-semibold)}
  .menubar .right{margin-left:auto;display:flex;gap:var(--sp-3);color:var(--label-1)}

  /* 窗口摆位 */
  .stage{position:absolute;inset:var(--h-menubar) 0 0 0}
  .window{left:50%;top:52px;width:760px;height:460px;margin-left:-380px}
  .window.inactive{filter:none}

  .body-row{flex:1 1 auto;display:flex;min-height:0}
  .icon{width:18px;height:18px;border-radius:var(--radius-icon);background:var(--control-fill-pressed);flex:0 0 auto}
  .row .meta{margin-left:auto;font-size:var(--fs-label);color:var(--label-2)}
  .row.selected .meta{color:var(--label-on-accent)}
  .toolbar .chip{display:inline-flex;align-items:center;height:22px;padding:0 var(--sp-2);
    border-radius:var(--radius-control);background:var(--control-fill);font-size:var(--fs-label)}
</style>
</head>
<body>
<div id="wall"></div>

<header class="menubar glass-menubar">
  <b>Starter</b><span>文件</span><span>编辑</span><span>视图</span><span>窗口</span>
  <div class="right">
    <button class="btn" id="btn-theme" style="height:20px;font-size:var(--fs-label)">深色</button>
    <button class="btn" id="btn-rt" style="height:20px;font-size:var(--fs-label)">降低透明度</button>
    <span id="clock">--:--</span>
  </div>
</header>

<main class="stage">
  <section class="window" id="win">
    <div class="titlebar">
      <div class="traffic-lights"><i class="tl-close"></i><i class="tl-min"></i><i class="tl-max"></i></div>
      <span class="spacer"></span><span class="title">示例窗口</span><span class="spacer"></span>
    </div>
    <div class="toolbar">
      <div class="segmented" role="tablist">
        <button role="tab" aria-selected="true">列表</button>
        <button role="tab" aria-selected="false">网格</button>
      </div>
      <span class="chip">3 项</span>
      <span class="spacer"></span>
      <input class="field" placeholder="搜索" style="width:160px">
      <button class="btn btn-accent">新建</button>
    </div>
    <div class="body-row">
      <nav class="sidebar">
        <div class="section-title">栏目</div>
        <ul class="list">
          <li class="row selected"><span class="icon"></span>全部<span class="meta">3</span></li>
          <li class="row"><span class="icon"></span>最近<span class="meta">1</span></li>
          <li class="row"><span class="icon"></span>归档<span class="meta">2</span></li>
        </ul>
      </nav>
      <div class="content scroll-area at-top" id="content">
        <h2 style="font-size:var(--fs-title);line-height:var(--lh-tight);margin-bottom:var(--sp-2)">内容优先，控件退后</h2>
        <p style="color:var(--label-2);margin-bottom:var(--sp-4)">
          正文 13px／行高 1.5；玻璃只给菜单栏与工具栏；内容层不透明。改主题与「降低透明度」看令牌如何一处生效。
        </p>
        <ul class="list">
          <li class="row selected"><span class="icon"></span>设计令牌<span class="meta">tokens.css</span></li>
          <li class="row"><span class="icon"></span>组件配方<span class="meta">components.css</span></li>
          <li class="row"><span class="icon"></span>实证样例<span class="meta">macos-desktop-demo.html</span></li>
        </ul>
      </div>
    </div>
  </section>
</main>

<div class="toast-stack" id="toasts"></div>

<script>
/* 骨架只负责：主题切换 / 降低透明度 / 时钟 / 列表选中 / 最小通知。业务逻辑请自行扩展 */
const html=document.documentElement;
document.getElementById('btn-theme').onclick=()=>{
  const dark=html.dataset.theme==='dark';
  html.dataset.theme=dark?'light':'dark';
  document.getElementById('btn-theme').textContent=dark?'深色':'浅色';
};
document.getElementById('btn-rt').onclick=()=>{
  const on=html.dataset.reduceTransparency==='1';
  if(on) delete html.dataset.reduceTransparency; else html.dataset.reduceTransparency='1';
  document.getElementById('btn-rt').textContent=on?'降低透明度':'恢复透明度';
};
const clock=document.getElementById('clock');
(function tick(){
  const d=new Date();
  clock.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  setTimeout(tick,1000);
})();
/* 列表选中：点击切换 selected */
document.querySelectorAll('.list').forEach(ul=>{
  ul.addEventListener('click',e=>{
    const row=e.target.closest('.row'); if(!row) return;
    ul.querySelectorAll('.row').forEach(r=>r.classList.toggle('selected',r===row));
  });
});
/* 通知示例（真实项目请按需调用） */
function notify(title,desc){
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML='<div class="t"></div><div class="d"></div>';
  el.querySelector('.t').textContent=title;
  el.querySelector('.d').textContent=desc;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity var(--dur-float)';setTimeout(()=>el.remove(),240);},3200);
}
notify('骨架已就绪','复制这个结构即可起步');
</script>
</body>
</html>
