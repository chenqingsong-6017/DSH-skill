<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macOS 风格桌面 · 设计语言演示</title>
<style>
/* ============================================================
   macOS 风格桌面演示 — 设计令牌与基础样式
   基线：macOS 27 Golden Gate（Liquid Glass 修正版）
   ============================================================ */

/* ---------- 字体（SF Pro 无法授权分发，Inter 作近似，Mac 上自动回落到 SF） ---------- */
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.woff2) format('woff2')}

/* ---------- 基础重置 ---------- */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI','Helvetica Neue',sans-serif;
  font-size:13px;color:var(--text-1);background:#0a0a0c;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;cursor:default;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
input,textarea{font:inherit;color:inherit;border:0;background:none}
input:focus,[contenteditable]:focus{outline:none}
img,svg{-webkit-user-drag:none;user-select:none}
::selection{background:rgba(0,122,255,.28)}
[contenteditable],input,textarea,.selectable{user-select:text}
:focus-visible{outline:2px solid rgba(0,122,255,.55);outline-offset:1px;border-radius:4px}

/* 滚动条：macOS 悬浮细滚动条 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:5px;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(0,0,0,.38);background-clip:content-box}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.24);background-clip:content-box}
[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.4);background-clip:content-box}

/* ---------- 设计令牌 ---------- */
:root{
  --accent:#007aff;
  --text-1:#1d1d1f;--text-2:rgba(0,0,0,.55);--text-3:rgba(0,0,0,.32);
  --hairline:rgba(0,0,0,.09);--hairline-strong:rgba(0,0,0,.17);
  --hover:rgba(0,0,0,.055);--field:rgba(0,0,0,.055);
  --win-bg:#ffffff;--titlebar-bg:rgba(247,247,249,.94);
  --sidebar-bg:rgba(243,243,245,.92);
  --glass:rgba(250,250,252,.74);--glass-strong:rgba(246,246,248,.88);
  --panel-border:rgba(0,0,0,.08);
  --dock-glass:rgba(255,255,255,.38);--dock-border:rgba(255,255,255,.55);
  --menubar-glass:rgba(252,252,253,.5);
  --seg-bg:rgba(0,0,0,.06);--seg-sel:#ffffff;
  --dot:#545458;
  --shadow-win:0 0 0 .5px rgba(0,0,0,.13),0 9px 24px rgba(0,0,0,.13),0 28px 66px rgba(0,0,0,.22);
  --shadow-win-dim:0 0 0 .5px rgba(0,0,0,.1),0 6px 18px rgba(0,0,0,.09),0 16px 40px rgba(0,0,0,.13);
  --shadow-panel:0 0 0 .5px rgba(0,0,0,.09),0 12px 40px rgba(0,0,0,.22);
  --radius-win:11px;
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.22,1.18,.36,1);
  --dock-size:52px;
  --calc-num:rgba(0,0,0,.07);--calc-num-h:rgba(0,0,0,.13);
  --calc-fn:rgba(0,0,0,.16);--calc-fn-h:rgba(0,0,0,.24);
}
[data-theme="dark"]{
  --accent:#0a84ff;
  --text-1:#f5f5f7;--text-2:rgba(255,255,255,.56);--text-3:rgba(255,255,255,.34);
  --hairline:rgba(255,255,255,.12);--hairline-strong:rgba(255,255,255,.22);
  --hover:rgba(255,255,255,.09);--field:rgba(255,255,255,.09);
  --win-bg:#1e1e21;--titlebar-bg:rgba(40,40,43,.94);
  --sidebar-bg:rgba(30,30,33,.92);
  --glass:rgba(40,40,43,.74);--glass-strong:rgba(44,44,48,.88);
  --panel-border:rgba(255,255,255,.12);
  --dock-glass:rgba(40,40,44,.5);--dock-border:rgba(255,255,255,.14);
  --menubar-glass:rgba(26,26,28,.42);
  --seg-bg:rgba(255,255,255,.1);--seg-sel:rgba(255,255,255,.24);
  --dot:#e8e8ea;
  --shadow-win:0 0 0 .5px rgba(0,0,0,.55),0 9px 24px rgba(0,0,0,.45),0 28px 66px rgba(0,0,0,.6);
  --shadow-win-dim:0 0 0 .5px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.45);
  --shadow-panel:0 0 0 .5px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.55);
  --calc-num:rgba(255,255,255,.14);--calc-num-h:rgba(255,255,255,.22);
  --calc-fn:rgba(255,255,255,.26);--calc-fn-h:rgba(255,255,255,.36);
}

/* 主题切换的平滑过渡（作用于所有主要表面） */
body,.menubar,.dock,.titlebar,.mb-menu,.ctx,.cc-card,.notif,.alert,.st-side,.nt-side,.fnd-side,.fnd-main,.nt-main,.seg,.spot-box,.search-field{
  transition:background-color .38s var(--ease),border-color .38s var(--ease),color .22s var(--ease),box-shadow .3s var(--ease);
}

/* ---------- 壁纸（纯 CSS 渐变，模拟 macOS 抽象壁纸） ---------- */
.wallpaper{position:fixed;inset:0;z-index:0;background:#dfe7f5}
.wallpaper::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(135% 115% at 50% 28%,transparent 55%,rgba(0,0,0,.17) 100%)}
.wp-0{background:
  radial-gradient(90% 72% at 14% 8%,#c9dfff 0%,transparent 55%),
  radial-gradient(78% 62% at 86% 6%,#ddd4ff 0%,transparent 60%),
  radial-gradient(105% 80% at 80% 90%,#ffd3e6 0%,transparent 58%),
  radial-gradient(95% 92% at 10% 88%,#bcdcff 0%,transparent 62%),
  linear-gradient(165deg,#eff4fd 0%,#f2eefe 48%,#fdeff6 100%)}
.wp-1{background:
  radial-gradient(95% 75% at 18% 10%,#ffe0b8 0%,transparent 58%),
  radial-gradient(85% 65% at 85% 12%,#ffc9c2 0%,transparent 60%),
  radial-gradient(110% 85% at 75% 92%,#ffb7d4 0%,transparent 58%),
  radial-gradient(90% 90% at 12% 86%,#ffd9a8 0%,transparent 62%),
  linear-gradient(160deg,#fff3e4 0%,#ffe3e0 52%,#ffd8ea 100%)}
.wp-2{background:
  radial-gradient(95% 75% at 15% 10%,#2b3a7d 0%,transparent 58%),
  radial-gradient(85% 65% at 85% 8%,#4a2e7e 0%,transparent 62%),
  radial-gradient(115% 85% at 80% 92%,#173a63 0%,transparent 60%),
  radial-gradient(90% 90% at 10% 90%,#3d2670 0%,transparent 62%),
  linear-gradient(165deg,#0c1128 0%,#151837 50%,#0b0d20 100%)}
.wp-3{background:
  radial-gradient(80% 60% at 78% 18%,#ffb36b 0%,transparent 55%),
  radial-gradient(70% 55% at 88% 45%,#ff7d6e 0%,transparent 60%),
  radial-gradient(110% 80% at 30% 95%,#5b2a6e 0%,transparent 62%),
  radial-gradient(90% 70% at 10% 20%,#5a3f8f 0%,transparent 58%),
  linear-gradient(200deg,#3b2358 0%,#83406e 42%,#e0755f 78%,#ffc98a 100%)}
[data-theme="dark"] .wp-0{background:
  radial-gradient(90% 72% at 14% 8%,rgba(64,118,224,.4) 0%,transparent 55%),
  radial-gradient(78% 62% at 86% 6%,rgba(128,92,224,.34) 0%,transparent 60%),
  radial-gradient(105% 80% at 80% 90%,rgba(224,88,158,.25) 0%,transparent 58%),
  radial-gradient(95% 92% at 10% 88%,rgba(56,120,204,.32) 0%,transparent 62%),
  linear-gradient(165deg,#0e1526 0%,#161228 50%,#1c0f1e 100%)}
[data-theme="dark"] .wp-1{background:
  radial-gradient(95% 75% at 18% 10%,rgba(224,140,56,.34) 0%,transparent 58%),
  radial-gradient(85% 65% at 85% 12%,rgba(220,84,84,.3) 0%,transparent 60%),
  radial-gradient(110% 85% at 75% 92%,rgba(224,88,140,.24) 0%,transparent 58%),
  radial-gradient(90% 90% at 12% 86%,rgba(220,160,64,.26) 0%,transparent 62%),
  linear-gradient(160deg,#221408 0%,#26100e 52%,#1e0c16 100%)}
[data-theme="dark"] .wp-2{background:
  radial-gradient(95% 75% at 15% 10%,#22305f 0%,transparent 58%),
  radial-gradient(85% 65% at 85% 8%,#38215e 0%,transparent 62%),
  radial-gradient(115% 85% at 80% 92%,#102a47 0%,transparent 60%),
  radial-gradient(90% 90% at 10% 90%,#2c1a52 0%,transparent 62%),
  linear-gradient(165deg,#080b1c 0%,#101329 50%,#070914 100%)}
[data-theme="dark"] .wp-3{background:
  radial-gradient(80% 60% at 78% 18%,rgba(255,160,80,.4) 0%,transparent 55%),
  radial-gradient(70% 55% at 88% 45%,rgba(240,100,80,.34) 0%,transparent 60%),
  radial-gradient(110% 80% at 30% 95%,rgba(70,32,88,.5) 0%,transparent 62%),
  radial-gradient(90% 70% at 10% 20%,rgba(80,54,128,.4) 0%,transparent 58%),
  linear-gradient(200deg,#200f33 0%,#4a1f42 45%,#8c3f4a 80%,#b86a4a 100%)}

/* ---------- 亮度遮罩（控制中心调节亮度时作用于全局） ---------- */
#dim{position:fixed;inset:0;z-index:58000;background:#000;opacity:0;pointer-events:none;transition:opacity .15s linear}

/* ---------- 桌面与桌面图标 ---------- */
.desktop{position:fixed;inset:26px 0 0 0;z-index:1}
.dicons{position:absolute;top:12px;right:16px;display:flex;flex-direction:column;gap:16px;align-items:center}
.dicon{width:92px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:8px;cursor:default}
.dicon .di-img{width:58px;height:58px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 6px 14px rgba(0,0,0,.2))}
.dicon .di-img svg{width:100%;height:100%}
.dicon .di-label{font-size:12.5px;line-height:1.25;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:1px 6px;border-radius:4px;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.dicon.sel .di-label{background:var(--accent);text-shadow:none}
.dicon.sel .di-img{filter:drop-shadow(0 6px 14px rgba(0,0,0,.2)) brightness(.9)}
.dicon .di-rename{display:none;font-size:12.5px;background:#fff;color:#000;border-radius:3px;border:2px solid var(--accent);padding:0 4px;width:84px;text-align:center}

/* ---------- 菜单栏 ---------- */
.menubar{position:fixed;top:0;left:0;right:0;height:26px;z-index:10000;
  display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 6px;
  background:var(--menubar-glass);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  box-shadow:0 .5px 0 rgba(0,0,0,.08);font-size:13px}
.mb-left,.mb-right{display:flex;align-items:center}
.mb-item{height:22px;padding:0 9.5px;border-radius:5px;display:inline-flex;align-items:center;font-size:13px;letter-spacing:.1px;white-space:nowrap}
.mb-item:hover,.mb-item.open{background:var(--hover)}
.mb-apple{padding:0 8px}
.mb-apple svg{width:15px;height:15px;fill:currentColor;display:block}
.mb-appname{font-weight:600}
.mb-right{gap:2px}
.mb-status{display:flex;align-items:center;gap:4px;padding:0 7px;height:22px;border-radius:5px;font-size:12.5px;font-variant-numeric:tabular-nums}
.mb-status:hover{background:var(--hover)}
.mb-status svg{width:24px;height:13px;display:block}
.mb-icon{width:27px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.mb-icon:hover,.mb-icon.open{background:var(--hover)}
.mb-icon svg{width:16px;height:16px;display:block;color:var(--text-1)}
.mb-clock{font-size:13px;font-variant-numeric:tabular-nums;padding:0 8px;letter-spacing:.2px}
.mb-hidden-when-narrow{display:inline-flex}

/* ---------- 下拉菜单（玻璃面板） ---------- */
.mb-menu{position:fixed;z-index:10001;min-width:212px;padding:4px;border-radius:8px;
  background:var(--glass);-webkit-backdrop-filter:blur(34px) saturate(200%);backdrop-filter:blur(34px) saturate(200%);
  box-shadow:var(--shadow-panel);border:.5px solid var(--panel-border);
  transform-origin:top left;animation:menuIn .16s var(--ease)}
@keyframes menuIn{from{opacity:0;transform:scale(.97) translateY(-4px)}}
.mm-item{height:25px;display:flex;align-items:center;gap:24px;justify-content:space-between;padding:0 9px;border-radius:5px;font-size:13px;color:var(--text-1);white-space:nowrap}
.mm-item:hover{background:var(--accent);color:#fff}
.mm-item:hover .mm-key{color:rgba(255,255,255,.72)}
.mm-item .mm-label{flex:1}
.mm-key{font-size:12.5px;color:var(--text-3);letter-spacing:.5px}
.mm-item.disabled{color:var(--text-3);pointer-events:none}
.mm-sep{height:1px;background:var(--hairline);margin:4px 9px}
.mm-head{font-size:11px;color:var(--text-3);padding:5px 9px 3px}
/* ---------- Dock ---------- */
.dock-wrap{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:9000}
.dock{display:flex;align-items:flex-end;padding:9px 12px 8px;background:var(--dock-glass);
  border-radius:24px;border:.5px solid var(--dock-border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 32px rgba(0,0,0,.22);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
[data-theme="dark"] .dock{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 32px rgba(0,0,0,.45)}
.dock-item{position:relative;display:flex;align-items:flex-end;padding:0 3px 7px;transition:padding .16s var(--ease)}
.dock-icon{width:var(--dock-size);height:var(--dock-size);transition:transform .13s ease-out;transform-origin:bottom center;will-change:transform}
.dock-icon svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.2))}
.icon-inner{width:100%;height:100%}
.dock-item.bouncing .icon-inner{animation:dockBounce .72s var(--ease)}
@keyframes dockBounce{0%,100%{transform:translateY(0)}28%{transform:translateY(-22px)}46%{transform:translateY(0)}64%{transform:translateY(-11px)}80%{transform:translateY(0)}90%{transform:translateY(-3px)}}
.dock-dot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--dot);opacity:0;transition:opacity .2s}
.dock-item.running .dock-dot{opacity:.85}
.dock-tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
  background:var(--glass-strong);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border:.5px solid var(--panel-border);border-radius:6px;padding:3px 10px;font-size:12px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 4px 16px rgba(0,0,0,.16)}
.dock-item:hover .dock-tip{opacity:1}
.dock-sep{width:1px;align-self:center;height:calc(var(--dock-size)*.8);background:var(--hairline-strong);margin:0 8px;border-radius:1px}

/* ---------- 窗口 ---------- */
.win{position:fixed;display:flex;flex-direction:column;background:var(--win-bg);border-radius:var(--radius-win);
  box-shadow:var(--shadow-win-dim);overflow:hidden;min-width:320px;min-height:200px;
  animation:winIn .24s var(--spring)}
@keyframes winIn{from{opacity:0;transform:scale(.93) translateY(12px)}}
.win.active{box-shadow:var(--shadow-win)}
.win.opened{animation:none}
.win.closing{opacity:0;transform:scale(.94);transition:opacity .16s ease-in,transform .16s ease-in;pointer-events:none}
.win.minimizing{opacity:0;transform:scale(.06);transition:opacity .42s ease-in,transform .42s var(--ease);pointer-events:none}
.win.zooming{transition:left .3s var(--ease),top .3s var(--ease),width .3s var(--ease),height .3s var(--ease)}
.titlebar{position:relative;flex:none;height:44px;display:flex;align-items:center;padding:0 14px 0 15px;background:var(--titlebar-bg);border-bottom:.5px solid var(--hairline)}
.titlebar.dragging *{pointer-events:none}
.traffic{display:flex;gap:8px;margin-right:12px;flex:none}
.tl{width:12px;height:12px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;border:.5px solid rgba(0,0,0,.12);flex:none}
.tl svg{width:7px;height:7px;opacity:0;transition:opacity .12s}
.tl-close{background:#ff6159}.tl-min{background:#ffbd2e}.tl-max{background:#28c941}
.tl:active{filter:brightness(.8)}
.win:not(.active) .tl{background:#d4d4d6;border-color:rgba(0,0,0,.06)}
[data-theme="dark"] .win:not(.active) .tl{background:#5a5a5e;border-color:transparent}
.traffic:hover .tl svg{opacity:.62}
.tl-close svg{color:#820a05}.tl-min svg{color:#9a5b00}.tl-max svg{color:#0a6b0d}
.win-title{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;max-width:42%;overflow:hidden;text-overflow:ellipsis}
.tb-left{display:flex;align-items:center;gap:2px;margin-left:2px;z-index:1}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto;z-index:1}
.tb-btn{width:28px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.tb-btn svg{width:15px;height:15px}
.tb-btn:hover{background:var(--hover);color:var(--text-1)}
.tb-btn.disabled{opacity:.32;pointer-events:none}
.win-body{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--win-bg);position:relative}
.resize-h{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;z-index:6}

/* 通用控件 */
.search-field{height:26px;display:flex;align-items:center;gap:5px;background:var(--field);border-radius:7px;padding:0 8px;width:150px;color:var(--text-3)}
.search-field svg{width:13px;height:13px;flex:none}
.search-field input{flex:1;font-size:12.5px;color:var(--text-1);min-width:0}
.search-field input::placeholder{color:var(--text-3)}
.seg{display:flex;background:var(--seg-bg);border-radius:7px;padding:2px;gap:2px}
.seg button{height:20px;padding:0 9px;border-radius:5px;font-size:12px;color:var(--text-2);display:flex;align-items:center}
.seg button svg{width:13px;height:13px}
.seg button.on{background:var(--seg-sel);color:var(--text-1);box-shadow:0 1px 3px rgba(0,0,0,.13);font-weight:500}

/* ---------- 访达 ---------- */
.finder{flex:1;display:flex;min-height:0}
.fnd-side{width:186px;flex:none;background:var(--sidebar-bg);border-right:.5px solid var(--hairline);padding:8px 8px 12px;overflow:auto}
.fnd-sec{font-size:11px;font-weight:600;color:var(--text-3);padding:10px 8px 4px;letter-spacing:.2px}
.fnd-item{display:flex;align-items:center;gap:7px;height:27px;padding:0 7px;border-radius:6px;font-size:13px}
.fnd-item:hover{background:var(--hover)}
.fnd-item.sel{background:var(--accent);color:#fff}
.fnd-ic{width:16px;height:16px;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.fnd-ic svg{width:15px;height:15px}
.fnd-item.sel .fnd-ic{color:#fff}
.fnd-main{flex:1;display:flex;flex-direction:column;min-width:0}
.fnd-content{flex:1;overflow:auto;padding:14px 16px 20px}
.fnd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px 8px}
.gitem{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 7px;border-radius:8px;text-align:center}
.gitem:hover{background:var(--hover)}
.gitem.sel{background:rgba(0,122,255,.15)}
[data-theme="dark"] .gitem.sel{background:rgba(10,132,255,.26)}
.gitem .gi-img{width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.gitem .gi-img svg{width:100%;height:100%}
.gitem .gi-label{font-size:12.5px;line-height:1.25;max-width:98px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:4px;padding:1px 5px}
.gitem.sel .gi-label{background:var(--accent);color:#fff}
.fnd-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:13px}

/* ---------- 备忘录 ---------- */
.notes{flex:1;display:flex;min-height:0}
.nt-side{width:214px;flex:none;background:var(--sidebar-bg);border-right:.5px solid var(--hairline);overflow:auto;padding:8px}
.nt-item{padding:8px 9px 7px;border-radius:8px;margin-bottom:2px}
.nt-item:hover{background:var(--hover)}
.nt-item.sel{background:rgba(0,122,255,.15)}
[data-theme="dark"] .nt-item.sel{background:rgba(10,132,255,.28)}
.nt-t{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-s{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-main{flex:1;display:flex;flex-direction:column;min-width:0}
.nt-toolrow{flex:none;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.nt-date{font-size:12px;color:var(--text-3)}
.nt-editor{flex:1;overflow:auto;padding:0 32px 32px}
.nt-title{font-size:23px;font-weight:700;letter-spacing:-.3px;padding:4px 0 10px;outline:none}
.nt-body{font-size:14px;line-height:1.55;outline:none;min-height:220px;white-space:pre-wrap}
/* ---------- 计算器 ---------- */
.calc{flex:1;display:flex;flex-direction:column;background:var(--win-bg)}
.calc-disp{flex:none;height:96px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 24px 10px;
  font-size:46px;font-weight:300;letter-spacing:-1px;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:8px 14px 18px;align-content:end;justify-items:center}
.cbtn{width:58px;height:58px;border-radius:50%;background:var(--calc-num);font-size:21px;display:flex;align-items:center;justify-content:center;transition:background .1s,filter .1s}
.cbtn:hover{background:var(--calc-num-h)}
.cbtn:active{filter:brightness(1.25)}
.cbtn.fn{background:var(--calc-fn);font-size:19px}
.cbtn.fn:hover{background:var(--calc-fn-h)}
.cbtn.op{background:#ff9f0a;color:#fff}
.cbtn.op:hover{background:#ffb340}
.cbtn.op.on{background:#fff;color:#ff9f0a}
.cbtn.zero{grid-column:span 2;width:122px;border-radius:29px;justify-content:flex-start;padding-left:23px}

/* ---------- 终端 ---------- */
.win.dark-chrome .titlebar{background:rgba(44,44,48,.94);border-bottom-color:rgba(255,255,255,.08)}
.win.dark-chrome .win-title{color:#f0f0f2}
.win.dark-chrome .tb-btn{color:rgba(255,255,255,.72)}
.win.dark-chrome .tb-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.win.dark-chrome:not(.active) .tl{background:#5a5a5e;border-color:transparent}
.term{flex:1;display:flex;flex-direction:column;min-height:0;background:rgba(16,16,18,.88);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  color:#e6e6e9;font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace;
  font-size:12.5px;line-height:1.52;padding:10px 14px;overflow:auto;cursor:text}
.term-line{white-space:pre-wrap;word-break:break-all;min-height:1.5em;display:flex;align-items:center}
.term-line .t-prompt{flex:none;white-space:pre}
.t-u{color:#7ee787}.t-h{color:#79c0ff}.t-p{color:#d2a8ff}.t-g{color:#79c0ff}.t-w{color:#f8d28c}
.term input.t-input{flex:1;background:none;border:0;color:#e6e6e9;font:inherit;caret-color:#e6e6e9;min-width:8px;padding:0}
.term-out{white-space:pre-wrap;word-break:break-all;color:#d0d3d8}
.term-err{color:#ff7b72}
.term-ok{color:#7ee787}
.term-dim{color:#8b8f98}

/* ---------- 系统设置 ---------- */
.settings{flex:1;display:flex;min-height:0}
.st-side{width:214px;flex:none;background:var(--sidebar-bg);border-right:.5px solid var(--hairline);padding:8px;overflow:auto}
.st-side .search-field{width:auto;margin:4px 2px 10px}
.st-item{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:7px;font-size:13px;margin-bottom:1px}
.st-item:hover{background:var(--hover)}
.st-item.sel{background:var(--accent);color:#fff}
.st-ic{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.st-ic svg{width:12.5px;height:12.5px}
.st-main{flex:1;overflow:auto;padding:22px 26px 30px}
.st-title{font-size:17px;font-weight:700;margin-bottom:16px}
.st-card{background:var(--field);border-radius:10px;padding:2px 14px;margin-bottom:16px}
.st-row{display:flex;align-items:center;justify-content:space-between;min-height:42px;gap:12px;font-size:13px}
.st-row+.st-row{border-top:.5px solid var(--hairline)}
.st-sub{font-size:11.5px;color:var(--text-3);margin-top:2px;line-height:1.4}
.appearance-cards{display:flex;gap:12px;margin-bottom:18px}
.ap-card{flex:1;border-radius:9px;padding:9px;border:2px solid transparent;background:var(--field);text-align:center;font-size:12px}
.ap-card.sel{border-color:var(--accent)}
.ap-prev{height:58px;border-radius:6px;margin-bottom:8px;border:.5px solid var(--hairline);overflow:hidden;position:relative;display:flex}
.ap-prev .apl{width:32%;height:100%}
.ap-prev .apb{position:absolute;right:6px;top:9px;height:6px;border-radius:3px;width:52%}
.ap-light .apl{background:#ececf0}.ap-light .apb{background:#d9d9de}
.ap-dark .apl{background:#2a2a2e}.ap-dark .apb{background:#454549}
.ap-auto .apl{background:linear-gradient(105deg,#ececf0 50%,#2a2a2e 50%)}.ap-auto .apb{background:linear-gradient(105deg,#d9d9de 50%,#454549 50%)}
.accent-dots{display:flex;gap:12px;padding:8px 0 12px}
.ac-dot{width:19px;height:19px;border-radius:50%;position:relative}
.ac-dot.sel::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--text-2)}
.wp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wp-thumb{aspect-ratio:16/10;border-radius:9px;border:2px solid transparent;position:relative;overflow:hidden}
.wp-thumb.sel{border-color:var(--accent)}
.wp-thumb span{position:absolute;left:9px;bottom:7px;font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65)}
.sw{width:40px;height:24px;border-radius:12px;background:var(--field);position:relative;transition:background .18s;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:left .18s var(--ease)}
.sw.on{background:#34c759}
.sw.on::after{left:18px}
input.range{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--field);flex:1;max-width:200px;min-width:120px}
input.range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.about-app{flex:1;display:flex;flex-direction:column;align-items:center;padding:26px 20px;text-align:center}
.about-app .lg{width:70px;height:70px;color:var(--text-1);margin-bottom:14px}
.about-app .lg svg{width:100%;height:100%;fill:currentColor}
.about-app h2{font-size:17px;font-weight:700;margin-bottom:3px}
.about-app .ver{font-size:12px;color:var(--text-3);margin-bottom:18px}
.about-app .row{display:flex;justify-content:space-between;gap:30px;width:100%;max-width:262px;font-size:12.5px;padding:6px 0;border-bottom:.5px solid var(--hairline)}
.about-app .row .k{color:var(--text-2)}

/* ---------- 照片 ---------- */
.photos{flex:1;display:flex;flex-direction:column;min-height:0}
.ph-grid{flex:1;overflow:auto;padding:14px 16px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start}
.ph-tile{border-radius:9px;aspect-ratio:1/1;overflow:hidden;position:relative;background:var(--field);transition:transform .18s var(--ease),box-shadow .18s}
.ph-tile:hover{transform:scale(1.03);box-shadow:0 8px 22px rgba(0,0,0,.2);z-index:2}
.ph-tile.wide{grid-column:span 2;aspect-ratio:2.1/1}
.ph-tile .ph-cap{position:absolute;left:9px;bottom:7px;font-size:11px;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.5);opacity:0;transition:opacity .15s}
.ph-tile:hover .ph-cap{opacity:1}
.ph-light{position:fixed;inset:0;z-index:26000;background:rgba(8,8,10,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;animation:fadeIn .2s}
.ph-light .big{width:min(60vw,720px);aspect-ratio:16/10;border-radius:14px;box-shadow:0 40px 100px rgba(0,0,0,.65)}
.ph-light .cap{color:rgba(255,255,255,.82);font-size:13px}
.ph-close{position:absolute;top:22px;right:26px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff}
.ph-close:hover{background:rgba(255,255,255,.26)}
.ph-close svg{width:15px;height:15px}

/* ---------- Safari ---------- */
.safari{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--win-bg)}
.saf-center{position:absolute;left:50%;transform:translateX(-50%);width:min(430px,44%);z-index:1}
.saf-addr{height:28px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--field);border-radius:8px;font-size:13px;color:var(--text-2);width:100%}
.saf-addr svg{width:12px;height:12px;flex:none;color:var(--text-3)}
.saf-page{flex:1;overflow:auto;padding:30px 42px}
.saf-h{font-size:15px;font-weight:700;margin-bottom:14px}
.saf-fav{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:30px}
.fav-t{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2)}
.fav-ic{width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.16);transition:transform .15s var(--ease)}
.fav-t:hover .fav-ic{transform:scale(1.06)}
.saf-priv{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text-2);background:var(--field);border-radius:10px;padding:12px 14px;line-height:1.5}
.saf-priv svg{width:15px;height:15px;flex:none;color:var(--accent)}

/* ---------- 聚焦搜索 ---------- */
.spot{position:fixed;inset:0;z-index:20000;display:flex;justify-content:center;align-items:flex-start;padding-top:15vh}
.spot-box{width:min(660px,92vw);background:var(--glass);-webkit-backdrop-filter:blur(44px) saturate(210%);backdrop-filter:blur(44px) saturate(210%);border-radius:14px;border:.5px solid var(--panel-border);box-shadow:var(--shadow-panel);overflow:hidden;animation:spotIn .22s var(--spring)}
@keyframes spotIn{from{opacity:0;transform:scale(.96) translateY(-8px)}}
.spot-input-row{display:flex;align-items:center;gap:12px;padding:0 18px;height:58px}
.spot-ic{width:22px;height:22px;color:var(--text-2);flex:none}
#spotInput{flex:1;font-size:23px;font-weight:300;letter-spacing:-.2px;background:none;min-width:0}
#spotInput::placeholder{color:var(--text-3)}
.spot-esc{font-size:11px;color:var(--text-3);border:.5px solid var(--hairline-strong);border-radius:5px;padding:2px 7px}
.spot-results{max-height:46vh;overflow:auto;padding:4px 10px 12px;border-top:.5px solid var(--hairline)}
.spot-head{font-size:11px;font-weight:600;color:var(--text-3);padding:9px 8px 4px}
.spot-row{display:flex;align-items:center;gap:10px;padding:6px 9px;border-radius:7px;font-size:13.5px}
.spot-row .sr-ic{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center}
.spot-row .sr-ic svg{width:100%;height:100%}
.spot-row .sr-ic.line{color:var(--text-2)}
.spot-row .sr-ic.line svg{width:15px;height:15px}
.spot-row .sr-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot-row .sr-sub{font-size:12px;color:var(--text-3)}
.spot-row.sel{background:var(--accent);color:#fff}
.spot-row.sel .sr-sub{color:rgba(255,255,255,.75)}
.spot-row.sel .sr-ic{color:#fff}
.spot-empty{padding:26px 0 30px;text-align:center;color:var(--text-3);font-size:13px}

/* ---------- 控制中心 ---------- */
.cc{position:fixed;top:30px;right:8px;width:322px;z-index:10002;display:none;flex-direction:column;gap:10px}
.cc.open{display:flex;animation:ccIn .22s var(--ease)}
@keyframes ccIn{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.cc-card{background:var(--glass);-webkit-backdrop-filter:blur(36px) saturate(200%);backdrop-filter:blur(36px) saturate(200%);border:.5px solid var(--panel-border);border-radius:16px;box-shadow:var(--shadow-panel);padding:12px}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cc-toggle{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;background:var(--field);text-align:left}
.cc-toggle:hover{background:var(--hover)}
.cc-tic{width:27px;height:27px;border-radius:50%;background:rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;color:var(--text-1);flex:none;transition:background .18s}
[data-theme="dark"] .cc-tic{background:rgba(255,255,255,.14)}
.cc-toggle.on .cc-tic{background:var(--accent);color:#fff}
.cc-tic svg{width:15px;height:15px}
.cc-tt{font-size:12px;font-weight:600;line-height:1.25}
.cc-ts{font-size:10.5px;color:var(--text-3)}
.cc-slider-row{display:flex;align-items:center;gap:10px;padding:4px 2px}
.cc-sl-ic{width:26px;height:26px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center;flex:none}
.cc-sl-ic svg{width:14px;height:14px}
.cc-slider{flex:1;height:22px;border-radius:11px;background:var(--field);position:relative;overflow:hidden}
.cc-slider .fill{position:absolute;top:0;bottom:0;left:0;background:rgba(120,120,128,.5)}
[data-theme="dark"] .cc-slider .fill{background:rgba(235,235,245,.62)}
.cc-slider .knob{position:absolute;top:1px;bottom:1px;width:20px;background:#fff;border-radius:50%;box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.28)}

/* ---------- 右键菜单 / 弹窗 / 通知 / 遮罩 ---------- */
.ctx{position:fixed;z-index:30000}
.alert-mask{position:fixed;inset:0;z-index:40000;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}}
.alert{width:274px;border-radius:12px;background:var(--glass-strong);-webkit-backdrop-filter:blur(44px) saturate(200%);backdrop-filter:blur(44px) saturate(200%);box-shadow:var(--shadow-panel);border:.5px solid var(--panel-border);padding:20px 16px 16px;text-align:center;animation:alertIn .2s var(--spring)}
@keyframes alertIn{from{opacity:0;transform:scale(.92)}}
.alert h3{font-size:13.5px;font-weight:700;margin-bottom:7px}
.alert p{font-size:12px;color:var(--text-2);line-height:1.5}
.alert-btns{display:flex;gap:9px;margin-top:18px}
.alert-btn{flex:1;height:30px;border-radius:7px;font-size:13px;background:var(--field);font-weight:500}
.alert-btn.primary{background:var(--accent);color:#fff}
.alert-btn:hover{filter:brightness(.96)}
.alert-btn.primary:hover{filter:brightness(1.1)}
.notif{position:fixed;top:34px;right:10px;width:344px;z-index:35000;display:flex;gap:11px;padding:12px 14px;border-radius:15px;
  background:var(--glass);-webkit-backdrop-filter:blur(38px) saturate(190%);backdrop-filter:blur(38px) saturate(190%);
  border:.5px solid var(--panel-border);box-shadow:var(--shadow-panel);animation:notifIn .5s var(--spring)}
@keyframes notifIn{from{opacity:0;transform:translateX(32px) scale(.96)}}
.notif.out{opacity:0;transform:translateX(32px);transition:opacity .3s ease-in,transform .3s ease-in}
.notif-ic{width:38px;height:38px;border-radius:9px;flex:none;overflow:hidden}
.notif-ic svg{width:100%;height:100%}
.notif-ic.line{display:flex;align-items:center;justify-content:center;background:var(--field);color:var(--text-1)}
.notif-ic.line svg{width:20px;height:20px}
.notif-t{font-size:13px;font-weight:700;margin-bottom:2px}
.notif-b{font-size:12.5px;color:var(--text-2);line-height:1.42}
#sleepOverlay{position:fixed;inset:0;z-index:60000;background:#000;opacity:0;transition:opacity .8s ease;cursor:pointer}
#sleepOverlay.on{opacity:1}
#shutdownOverlay{position:fixed;inset:0;z-index:61000;background:#000;display:flex;align-items:center;justify-content:center}
#powerBtn{display:flex;flex-direction:column;align-items:center;gap:15px;color:rgba(255,255,255,.5);font-size:13px}
#powerBtn svg{width:36px;height:36px}
#powerBtn:hover{color:#fff}
.hidden,[hidden]{display:none!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

/* ---------- 菜单交互 ---------- */

function closeMenus() {
  $$('.mb-menu:not(.ctx)').forEach(m => m.remove());

}
function openMenu(btn) {
  const key = btn.dataset.menukey;

  closeMenus();
  const items = menuItemsFor(key);
  if (!items) return;
  const menu = el('div', 'mb-menu');
  items.forEach(it => {
    if (it === 'sep') { menu.appendChild(el('div', 'mm-sep')); return; }
    const row = el('div', 'mm-item' + (it.disabled ? ' disabled' : ''));
    row.appendChild(el('span', 'mm-label', it.label));
    if (it.key) row.appendChild(el('span', 'mm-key', it.key));
    if (!it.disabled && it.action) row.addEventListener('click', () => { closeMenus(); it.action(); });
    menu.appendChild(row);
  });
  $('#menuLayer').appendChild(menu);
  const r = btn.getBoundingClientRect();
  menu.style.left = Math.min(r.left, innerWidth - menu.offsetWidth - 8) + 'px';

}

    if (openMenuKey !== null && !e.target.closest('.mb-menu') && !e.target.closest('.mb-item')) closeMenus();

  $$('#dock .dock-item').forEach(item => {
    const icon = item.querySelector('.dock-icon');
    const centerLocal = item.offsetLeft + item.offsetWidth / 2;
    const d = (cursorLocal - centerLocal) / sigma;
    const s = 1 + (maxScale - 1) * Math.exp(-(d * d));
    icon.style.transform = 'scale(' + s.toFixed(3) + ')';
    const pad = (3 + (s - 1) * size / 2).toFixed(1);

}

APP_BUILDERS.calculator = function (win, body) {
  body.innerHTML = '<div class="calc"><div class="calc-disp">0</div><div class="calc-grid"></div></div>';
  const disp = $('.calc-disp', body), grid = $('.calc-grid', body);
  const KEYS = [['AC', 'fn'], ['±', 'fn'], ['%', 'fn'], ['÷', 'op'],
    ['7', ''], ['8', ''], ['9', ''], ['×', 'op'],
    ['4', ''], ['5', ''], ['6', ''], ['−', 'op'],
    ['1', ''], ['2', ''], ['3', ''], ['+', 'op'],
    ['0', 'zero'], ['.', ''], ['=', 'op']];
  let acc = null, op = null, cur = '0', fresh = true, error = false;
  const fmt = n => { if (!isFinite(n)) return '错误'; const r = parseFloat(n.toPrecision(12)); return String(r); };
  function show() { disp.textContent = error ? '错误' : cur; }
  function clearOpLights() { $$('.cbtn.op', grid).forEach(b => b.classList.remove('on')); }
  function doOp(o) {
    const v = parseFloat(cur);
    if (op && !fresh) { const r = compute(acc, v, op); if (r === null) { error = true; show(); return; } cur = fmt(r); }
    else if (error) return;
    acc = parseFloat(cur); op = o; fresh = true;
    clearOpLights();
    const btn = $$('.cbtn.op', grid).find(b => b.dataset.k === o);
    if (btn && o !== '=') btn.classList.add('on');
    show();
  }
  function compute(a, b, o) {
    if (o === '+') return a + b; if (o === '−') return a - b;
    if (o === '×') return a * b;
    if (o === '÷') return b === 0 ? null : a / b;
    return b;
  }
  function press(k) {
    if (k === 'AC') { acc = null; op = null; cur = '0'; fresh = true; error = false; clearOpLights(); show(); return; }
    if (error && k !== 'AC') return;
    if (/^[0-9]$/.test(k)) { if (fresh) { cur = k; fresh = false; } else cur = cur === '0' ? k : cur + k; if (cur.length > 12) cur = cur.slice(0, 12); show(); return; }
    if (k === '.') { if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.'; show(); return; }
    if (k === '±') { cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; show(); return; }
    if (k === '%') { cur = fmt(parseFloat(cur) / 100); show(); return; }
    if (k === '=') {
      if (op) { const r = compute(acc, parseFloat(cur), op); error = r === null; if (!error) cur = fmt(r); }
      acc = null; op = null; fresh = true; clearOpLights(); show(); return;
    }
    if ('+−×÷'.includes(k)) doOp(k);
  }
  KEYS.forEach(([k, cls]) => {
    const b = el('button', 'cbtn ' + cls, k); b.dataset.k = k;
    b.addEventListener('click', () => press(k));
    grid.appendChild(b);
  });
  win.el.tabIndex = -1;
  win.el.addEventListener('keydown', e => {
    if (!win.el.classList.contains('active')) return;
    const m = { '/': '÷', '*': '×', '-': '−' };
    let k = m[e.key] || e.key;
    if (k === 'Enter' || k === '=') k = '=';
    if (k === 'Escape' || e.key === 'c' || e.key === 'C') k = 'AC';
    if (k === 'Backspace') { cur = cur.length > 1 ? cur.slice(0, -1) : '0'; if (cur === '-') cur = '0'; show(); e.preventDefault(); return; }
    if (/^[0-9.]$/.test(k) || ['+', '−', '×', '÷', '=', 'AC', '%'].includes(k)) { press(k); e.preventDefault(); }
  });
};

      else push('cat: ' + a[0] + ': No such file or directory', 'term-err');
    },
    neofetch() {
      for (let i = 0; i < ART.length; i++) {
        const info = INFO[i] || '';
        const colored = info.indexOf(':') > -1 ? '<span class="t-h">' + ESC(info.split(':')[0]) + '</span>:' + ESC(info.slice(info.indexOf(':') + 1)) : (info.startsWith('---') ? '<span class="term-dim">' + ESC(info) + '</span>' : '<span class="t-u">' + ESC(info) + '</span>');
        push('<span style="display:inline-block;width:33ch">' + ESC(ART[i]) + '</span>' + colored, '');
      }
    },
  };
  function exec(raw) {
    if (!raw.trim()) { return; }
    history.push(raw); hIdx = history.length;
    const parts = raw.trim().split(/\s+/);
    const fn = CMDS[parts[0]];
    if (fn) { try { fn(parts.slice(1), raw); } catch (err) { push(String(err), 'term-err'); } }
    else push('zsh: command not found: ' + ESC(parts[0]), 'term-err');
  }
  function newLine() { cur = inputLine(); }
  term.addEventListener('click', () => { if (cur) cur.inp.focus(); });
  newLine();
  term.addEventListener('keydown', e => {
    if (!cur) return;
    if (e.key === 'Enter') {
      const raw = cur.inp.value;
      cur.d.innerHTML = PROMPT + ESC(raw);
      exec(raw);
      newLine();
      e.preventDefault();
    } else if (e.key === 'ArrowUp') {
      if (hIdx > 0) { hIdx--; cur.inp.value = history[hIdx] || ''; }
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (hIdx < history.length - 1) { hIdx++; cur.inp.value = history[hIdx] || ''; }
      else { hIdx = history.length; cur.inp.value = ''; }
      e.preventDefault();
    }
  });
  push('Last login: ' + new Date().toLocaleString('zh-CN') + ' on ttys000', 'term-dim');
  push('输入 <span class="t-g">help</span> 查看可用命令；<span class="t-g">neofetch</span> 看系统信息。', 'term-dim');
  setTimeout(() => { if (cur) cur.inp.focus(); }, 60);
};

let spotOpen = false, spotSel = 0, spotRows = [], spotIndexCache = null;
function getSpotIndex() {
  if (spotIndexCache) return spotIndexCache;
  const idx = [];
  APPS.forEach(a => idx.push({ group: '应用程序', name: a.name, icon: a.icon, sub: '应用程序', open: () => openApp(a.id) }));
  idx.push({ group: '应用程序', name: '关于本机', icon: 'ic-settings', sub: '系统', open: openAboutWindow });
  const walk = (items, path) => (items || []).forEach(p => {
    if (p.type === 'file' || p.type === 'img') {
      idx.push({ group: '文稿', name: p.name, line: 'li-doc', sub: path, open: () => p.type === 'img' ? openPreview(p.name, null) : openPreview(p.name, p.content || '') });
    } else if (p.type === 'folder') walk(p.children, path + ' › ' + p.name);
  });
  walk(FS['桌面'], '桌面'); walk(FS['文稿'], '文稿'); walk(FS['下载'], '下载');
  STATE.notes.forEach(n => idx.push({ group: '备忘录', name: n.title || '新建备忘录', line: 'li-doc', sub: '备忘录', open: () => openNotesAt(n.id) }));
  spotIndexCache = idx;
  return idx;
}
function openNotesAt(id) {
  const w = WINS.filter(x => x.appId === 'notes' && !x.minimized)[0] || WINS.filter(x => x.appId === 'notes')[0];
  if (w) { if (w.minimized) restoreWin(w); else focusWin(w); if (w._refresh) w._refresh(id); }
  else { const nw = openApp('notes'); setTimeout(() => nw._refresh && nw._refresh(id), 0); }
}
function toggleSpot() { spotOpen ? closeSpot() : openSpot(); }
function openSpot() {
  spotOpen = true;
  const s = $('#spotlight'); s.hidden = false;
  const inp = $('#spotInput'); inp.value = '';
  doSpotSearch('');
  setTimeout(() => inp.focus(), 30);
}
function closeSpot() { spotOpen = false; $('#spotlight').hidden = true; }
function doSpotSearch(q) {
  const query = q.trim().toLowerCase();
  const box = $('#spotResults'); box.innerHTML = '';
  const idx = getSpotIndex();
  let rows;
  if (!query) {
    rows = idx.filter(x => x.group === '应用程序');
  } else {
    rows = idx.map(x => {
      const n = x.name.toLowerCase();
      const score = n.startsWith(query) ? 0 : n.includes(query) ? 1 : -1;
      return { x: x, s: score };
    }).filter(r => r.s > -1).sort((a, b) => a.s - b.s).map(r => r.x).slice(0, 12);
  }
  spotRows = []; spotSel = 0;
  if (!rows.length) { box.appendChild(el('div', 'spot-empty', '未找到「' + ESC(q) + '」')); return; }
  let lastGroup = null;
  rows.forEach((r, i) => {
    if (r.group !== lastGroup) { box.appendChild(el('div', 'spot-head', r.group)); lastGroup = r.group; }
    const row = el('div', 'spot-row' + (i === 0 ? ' sel' : ''));
    const ic = r.icon ? '<span class="sr-ic">' + svgUse(r.icon) + '</span>' : '<span class="sr-ic line">' + svgUse(r.line || 'li-doc') + '</span>';
    row.innerHTML = ic + '<span class="sr-name">' + ESC(r.name) + '</span><span class="sr-sub">' + ESC(r.sub || '') + '</span>';
    row.addEventListener('click', () => { closeSpot(); r.open(); });
    row.addEventListener('mousemove', () => setSpotSel(i));
    box.appendChild(row);
    spotRows.push(row);
  });
  setSpotSel(0);
}
function setSpotSel(i) {
  spotSel = clamp(i, 0, spotRows.length - 1);
  spotRows.forEach((r, j) => r.classList.toggle('sel', j === spotSel));
  if (spotRows[spotSel]) spotRows[spotSel].scrollIntoView({ block: 'nearest' });
}
function initSpotlight() {
  const inp = $('#spotInput');
  inp.addEventListener('input', () => doSpotSearch(inp.value));
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { setSpotSel(spotSel + 1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { setSpotSel(spotSel - 1); e.preventDefault(); }
    else if (e.key === 'Enter') {
      const rows = $$('#spotResults .spot-row');
      if (rows[spotSel]) rows[spotSel].click();
      e.preventDefault();
    }
  });
  $('#spotlight').addEventListener('pointerdown', e => { if (e.target.id === 'spotlight') closeSpot(); });
}

      const w = slider.clientWidth || 240;
      const x = clamp(v, 0, 1) * (w - 20);
      fill.style.width = (x + 10) + 'px';
      knob.style.left = Math.max(1, x) + 'px';
    }
    function fromEvent(e) {
      const r = slider.getBoundingClientRect();
      const v = clamp((e.clientX - r.left - 10) / (r.width - 20), 0, 1);
      set(v); layout(v);
    }
    slider.addEventListener('pointerdown', e => {
      try { slider.setPointerCapture(e.pointerId); } catch (err) { }
      fromEvent(e);

    slider._layout = layout;
    slider._v = get;
    cc.appendChild(card);
    setTimeout(() => layout(get()), 0);
    return slider;
  }

  document.body.appendChild(m);
  m.style.left = Math.min(x, innerWidth - m.offsetWidth - 8) + 'px';
  m.style.top = Math.min(y, innerHeight - m.offsetHeight - 8) + 'px';
  ctxEl = m;
}
function initContextMenu() {
  document.addEventListener('contextmenu', e => {
    if (e.target.closest('input,[contenteditable],.term')) return;
    e.preventDefault();
    const winNode = e.target.closest('.win');
    if (winNode) {
      const w = WINS.find(x => x.el === winNode);
      if (w) { showCtxMenu(e.clientX, e.clientY, [
        { label: '关闭窗口', key: '⌘W', action: () => closeWindow(w) },
        { label: '最小化', key: '⌘M', action: () => minimizeWin(w) },
        { label: '缩放', action: () => zoomWin(w) },
      ]); return; }
    }
    showCtxMenu(e.clientX, e.clientY, [
      { label: '新建文件夹', action: newDesktopFolder },
      'sep',
      { label: '更换墙纸', action: () => setWallpaper((STATE.wallpaper + 1) % 4) },
      { label: '进入睡眠', action: sleepNow },
      'sep',
      { label: '关于本机', action: openAboutWindow },
    ]);
  });
}

/* ---------- 全局事件 / 快捷键 ---------- */
function initGlobal() {
  document.addEventListener('pointerdown', e => {
    if (openMenuKey !== null && !e.target.closest('.mb-menu') && !e.target.closest('.mb-item')) closeMenus();
    if (ctxEl && !e.target.closest('.ctx')) hideCtxMenu();
    if (ccOpen && !e.target.closest('#ccPanel') && !e.target.closest('#ccBtn')) closeCC();
    if (e.target.closest('#desktop') && !e.target.closest('.dicon')) $$('.dicon.sel').forEach(x => x.classList.remove('sel'));
  });
  document.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.code === 'Space') { e.preventDefault(); toggleSpot(); return; }
    if (e.key === 'Escape') {
      if (spotOpen) closeSpot();
      closeMenus(); hideCtxMenu(); closeCC();
      const l = $('.ph-light'); if (l) l.remove();
      return;
    }
    if (mod && !e.shiftKey && e.key.toLowerCase() === 'w') { e.preventDefault(); closeFocused(); return; }
    if (mod && e.key.toLowerCase() === 'm') { e.preventDefault(); minimizeFocused(); return; }
  });
  document.addEventListener('dragstart', e => e.preventDefault());
  window.addEventListener('resize', () => { resetDock(); if (ccOpen) updateCC(); });
}

/* ---------- 强调色 / 启动 ---------- */
function applyAccent() { document.documentElement.style.setProperty('--accent', STATE.accent || '#007aff'); }
function parseParams() {
  const q = new URLSearchParams(location.search);
  if (q.get('theme')) STATE.theme = q.get('theme');
  if (q.get('wp') != null && q.get('wp') !== '') STATE.wallpaper = clamp(parseInt(q.get('wp'), 10) || 0, 0, 3);
  window.__bootApps = q.get('apps') ? q.get('apps').split(',') : null;
  window.__bootSpot = q.get('spot') === '1';
}
function boot() {
  parseParams();
  applyTheme(); applyAccent(); setWallpaper(STATE.wallpaper); applyBrightness();
  document.documentElement.style.setProperty('--dock-size', STATE.dockSize + 'px');
  buildDesktopIcons(); buildDock(); updateMenubarStatus(); tick(); setInterval(tick, 1000);
  buildCC(); initMenubar(); initGlobal(); initSpotlight(); initContextMenu();
  $('#sleepOverlay').addEventListener('click', wake);
  $('#powerBtn').addEventListener('click', () => location.reload());
  setTimeout(() => {
    notify(svgUse('ic-finder'), '欢迎使用 macOS 风格桌面',
      '纯前端演示：试试 Dock 放大、控制中心（右上角）、聚焦搜索（Control + 空格）。', { time: 9000 });
  }, 900);
  const apps = window.__bootApps;
  if (apps && apps.length) apps.forEach((a, i) => setTimeout(() => openApp(a.trim()), 300 + i * 180));
  else setTimeout(() => openApp('finder'), 420);
  if (window.__bootSpot) setTimeout(openSpot, 1500);
}
boot();
</script>
